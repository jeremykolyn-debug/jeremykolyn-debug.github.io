# Resource Library — one entry per resource. The same entry feeds the home page
# preview card, the library summary card, and the full critical review.
#
# Each entry starts as a planned slot: `focus` is the working title of the slot,
# and `title` stays "" until an actual resource is chosen. While `title` is empty
# the badge reads "Resource pending selection"; once chosen it reads "Review pending"
# until every review field is filled, then "Review complete".
#
#   id           anchor for links, e.g. /resources/#resource-01 (keep unique)
#   number       display number
#   focus        working title of this slot (shown as the heading)
#   for          planned audience: educators, students, or both
#                (drives the "For educators / For students" lists on the library page)
#   title        name of the selected resource — leave "" until chosen
#   publisher    author or publishing organization
#   type         e.g. Article, Video, Interactive tool, Organization
#                (type filter buttons appear automatically once 2+ types exist)
#   audience     who the selected resource itself is written for
#   url          full https:// link — leave "" until confirmed; the button stays disabled
#   teaser       one sentence for the summary cards
#   summary      What is this resource?            (Markdown allowed)
#   usefulness   Why might it be useful?
#   strengths    Strengths                          (a bullet list works well)
#   limitations  Limitations
#   credibility  Credibility assessment
#   perspective  My critical perspective
#
# Multi-paragraph example:
#   summary: |
#     First paragraph.
#
#     Second paragraph.

