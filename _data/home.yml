# Home page content.
# Leave a field as "" to show its placeholder. Multi-paragraph text uses `|`:
#   body: |
#     First paragraph.
#
#     Second paragraph.

hero:
  headline: "How Do We Teach Difficult Histories?"
  intro: "Exploring how educators and students can approach challenging historical subjects, with a particular focus on teaching and learning about the Holocaust."

why:
  heading: "Why This Matters"
  # Short website introduction shown above the full commentary
  lead: "Some historical subjects are especially difficult to introduce in the classroom. Events such as the Holocaust raise important questions about how educators present sensitive histories and how students engage with challenging material. This resource centre will explore approaches to teaching and learning about these subjects, with an emphasis on historical understanding, thoughtful discussion, and age-appropriate education."
  body: ""          # ~150–200 words of fuller introductory commentary

# The two audience cards. `url` points to the matching list in the Resource Library.
audiences:
  - id: for-educators
    label: "For Educators"
    icon: users
    text: "Explore resources and teaching considerations for introducing difficult historical topics in thoughtful, historically responsible, and age-appropriate ways."
    button: "Explore Educator Resources"
    url: /resources/#educators
  - id: for-students
    label: "For Students"
    icon: book
    text: "Find accessible learning resources that support historical understanding, critical questions, and reflection on difficult events."
    button: "Explore Student Resources"
    url: /resources/#students

# The three theme cards are generated from the chapters in _data/explore.yml.

steps:
  - number: "01"
    title: "Understand"
    text: "Read the educational commentary."
    icon: book
  - number: "02"
    title: "Explore"
    text: "Examine carefully reviewed resources."
    icon: compass
  - number: "03"
    title: "Reflect"
    text: "Consider questions and activities."
    icon: lightbulb

# Ids from _data/resources.yml to preview on the home page
featured_resources:
  - resource-01
  - resource-02
  - resource-03
featured_button: "View All Five Resources"
