<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.url == "/" %}
  <title>{{ site.title }} — {{ site.subtitle }}</title>
  {%- else %}
  <title>{{ page.short_title | default: page.title }} · {{ site.title }}</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: page.lede | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.lede | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#18263E">
  <link rel="icon" href="{{ '/assets/images/yrc-mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/yrc.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
  <noscript><style>.feedback[hidden]{display:block}.feedback-empty{display:none}</style></noscript>
</head>
<body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {%- if page.progress %}
  <div class="reading-progress" data-progress aria-hidden="true"></div>
  {%- endif %}
  {% include yrc/header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include yrc/footer.html %}
  <button class="to-top" type="button" data-to-top>
    {% include yrc/icon.html name="arrow-up" %}<span class="sr-only">Back to top</span>
  </button>
  <script src="{{ '/assets/js/yrc.js' | relative_url }}" defer></script>
</body>
</html>
